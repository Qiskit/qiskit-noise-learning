[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-noise-learning"
dynamic = ["version"]
description = "A toolkit for randomization-based quantum noise characterization."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ian Hincks", email = "ian.hincks@ibm.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy>=2",
    "qiskit>=2.5.0,<3",
    "rustworkx>=0.15",
    "samplomatic>=0.21",
    "scipy>=1.13",
    "xarray>=2025.7",
]


[tool.setuptools.packages.find]
include = ["qiskit_noise_learning*"]

[tool.setuptools.package-data]
# The interactive figures inline this script into their own HTML, so it has to travel with the
# installed package rather than being fetched at view time.
qiskit_noise_learning = ["visualizations/_static/*.js"]


[tool.setuptools_scm]
version_file = "qiskit_noise_learning/_version.py"

[project.urls]
Homepage = "https://github.com/Qiskit/qiskit-noise-learning"
BugTracker = "https://github.com/Qiskit/qiskit-noise-learning/issues"

[project.optional-dependencies]
dev = [
    "pytest",                 # For running tests
    "ruff",                   # Formatter and linter
    "pre-commit",             # Pre-commit hooks
    "reno>=4.1",              # Release notes management
    "scipy-doctest",          # SciPy's style of doc-testing
    # Local-mode execution and the fake-provider backends the tests transpile against. The package
    # itself imports neither.
    "qiskit-ibm-runtime>=0.51",
    "qiskit-aer",
]

vis = [
    # Draws the figures and typesets their labels.  3.8 is the floor for ``Figure.legend``'s
    # ``ncols`` spelling, which the two-legend layout uses.
    "matplotlib>=3.8",
]

docs = [
    # Documentation generator. The local extensions under ``docs/_ext`` are written against sphinx 9
    "sphinx>=9",
    "qiskit-sphinx-theme",          # Qiskit ecosystem HTML theme
    "myst-nb>=1.1",                 # Markdown (MyST) source support, plus executable notebooks
    "ipykernel",                    # Kernel that myst-nb executes tutorial notebooks with
    "sphinxcontrib-bibtex",         # BibTeX citations
    "sphinx-proof",                 # Numbered proposition/proof directives
    "reno>=4.1",                    # Renders the release notes page from releasenotes/
    # The tutorials run for real at build time, so building the docs needs whatever they plot with:
    "qiskit-noise-learning[vis]",   # matplotlib, for this package's own figures
    "qiskit[visualization]",        # matplotlib/pylatexenc, for QuantumCircuit.draw("mpl")
    "qiskit-ibm-runtime>=0.51",     # Tutorials need local-mode execution
    "qiskit-aer",                   # the simulator the tutorials run their programs on
]

cvxpy = [
    "cvxpy",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["qiskit_noise_learning", "test"]
filterwarnings = [
    "ignore:.*IBMFractionalTranslationPlugin is deprecated.*:DeprecationWarning",
]
pythonpath = ["."]

[tool.ruff]
lint.select = [
    "E",      # pycodestyle
    "F",      # pyflake
    "I",      # isort
    "SLF",    # private member access rules
    "UP",     # pyupgrade
]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]      # Ignore unused import in init files
