name: Nightly Dev Tests

on:
  schedule:
    - cron: '0 1 * * *'

jobs:
  tests:

    runs-on: ubuntu-latest
    # Enlarge the loader's surplus static TLS so that qiskit-aer's bundled libgomp can be loaded
    env:
      GLIBC_TUNABLES: glibc.rtld.optional_static_tls=4096
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        extras: ["dev,vis,cvxpy"]
        include:
          # cvxpy requires sparsediffpy<0.7.0, but 0.7.0 is the first release with a 3.15
          # wheel, and building the 0.6.1 sdist needs a BLAS the runners do not have. Drop
          # this entry, and the `extras` variable, once cvxpy's pin admits a 3.15 wheel.
          - python-version: "3.15"
            extras: "dev,vis"

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed for copyright year verification in pre-commit
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[${{ matrix.extras }}]"
          python -m pip install build extremal-python-dependencies==0.1.0
      - name: Install qiskit-ibm-runtime main
        # For Executor.run()'s conversion of a samplomatic QuantumProgram
        # (qiskit-ibm-runtime#3403), unreleased as of 0.50.0. Remove once the floor is >=0.51.
        run: python -m pip install --no-cache-dir "git+https://github.com/Qiskit/qiskit-ibm-runtime@main"
      - name: Build Qiskit SDK development wheel
        run: |
          cd ..
          git clone --filter=tree:0 https://github.com/Qiskit/qiskit
          cd qiskit
          git rev-parse HEAD
          python -m build --wheel
      - name: Pin development versions
        shell: bash
        run: >-
          extremal-python-dependencies pin-dependencies --inplace
          "qiskit @ file:$(echo qiskit/dist/*.whl)"
      - name: Pre-commit checks (linting)
        if: matrix.python-version == '3.15'
        run: |
          pre-commit run --all-files
      - name: Test with pytest
        run: |
          python -m pytest
