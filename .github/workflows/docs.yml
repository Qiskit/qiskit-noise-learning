name: Docs

on:
  # Lets the docs be rebuilt against any ref on demand
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "[0-9]+.[0-9]+.[0-9]+*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docs:

    runs-on: ubuntu-latest
    # Enlarge the loader's surplus static TLS so that qiskit-aer's bundled libgomp can be loaded
    env:
      GLIBC_TUNABLES: glibc.rtld.optional_static_tls=4096

    steps:
    - uses: actions/checkout@v4
      with:
        # reno derives the release notes from git history and tags, and fails on a shallow clone.
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.15"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[docs]"
    - name: Build docs
      run: sphinx-build -b html -W docs docs/_build/html
    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html
        if-no-files-found: error
