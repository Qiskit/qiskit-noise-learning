name: Docs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[docs]"
    - name: Install qiskit-ibm-runtime main
      # For Executor.run()'s conversion of a samplomatic QuantumProgram
      # (qiskit-ibm-runtime#3403), unreleased as of 0.50.0. Remove once the floor is >=0.51.
      run: python -m pip install --no-cache-dir "git+https://github.com/Qiskit/qiskit-ibm-runtime@main"
    - name: Build docs
      run: sphinx-build -b html -W docs docs/_build/html
    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html
        if-no-files-found: error
