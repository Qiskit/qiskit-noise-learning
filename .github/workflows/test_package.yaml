name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:

    runs-on: ubuntu-latest
    # Enlarge the loader's surplus static TLS so that qiskit-aer's bundled libgomp can be loaded
    env:
      GLIBC_TUNABLES: glibc.rtld.optional_static_tls=4096
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev,vis,cvxpy]"
    - name: Install qiskit-ibm-runtime main
      # For Executor.run()'s conversion of a samplomatic QuantumProgram
      # (qiskit-ibm-runtime#3403), unreleased as of 0.50.0. Remove once the floor is >=0.51.
      run: python -m pip install --no-cache-dir "git+https://github.com/Qiskit/qiskit-ibm-runtime@main"
    - name: Pre-commit checks (linting)
      if: matrix.python-version == '3.12'
      run: |
        pre-commit run --all-files
    - name: Test with pytest
      run: |
        python -m pytest
